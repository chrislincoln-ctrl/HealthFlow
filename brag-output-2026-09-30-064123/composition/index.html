    <script>
      const FPS = 30;

      /* SVG line-draw setup: measure once, at build time (seek-safe) */
      function dashSetup(sel) {
        const el = document.querySelector(sel);
        const len = el.getTotalLength();
        if (!el.getAttribute("stroke-dasharray")) el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
        return len;
      }
      const corrLens = [...document.querySelectorAll("#corridors .corr")].map((el) => ({ el, len: el.getTotalLength() }));

      const tl = gsap.timeline({ paused: true });

      /* ═══ SCENE 1 — atmospheric network reveal (0 – 4.2) ═══ */
      tl.fromTo("#atmo-wrap", { opacity: 0 }, { opacity: 0.85, duration: 1.4, ease: "power1.out" }, 0.1);
      tl.fromTo("#net", { scale: 1.045, transformOrigin: "50% 46%" }, { scale: 1, duration: 5.2, ease: "power1.out" }, 0);
      // facility nodes breathe in, one by one
      tl.fromTo(".node", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out", stagger: 0.13 }, 0.5);
      // corridors draw between neighbors
      corrLens.forEach((c, i) => {
        tl.fromTo(c.el, { strokeDashoffset: c.len, strokeOpacity: 0 }, { strokeDashoffset: 0, strokeOpacity: 0.26, duration: 0.7, ease: "power1.inOut" }, 1.25 + i * 0.14);
      });
      // motes drift (finite yoyo repeats — seek-safe)
      document.querySelectorAll(".mote").forEach((m, i) => {
        const d = 3 + (i % 4) * 0.55;
        tl.fromTo(m, { y: 0 }, { y: i % 2 ? -14 - (i % 3) * 5 : 12 + (i % 3) * 6, duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.min(5, Math.floor(17 / d)) }, 0.4 + i * 0.2);
      });

      /* ═══ SCENE 2 — risk emerges (4.2 – 8.2) ═══ */
      tl.to("#v-node", { attr: { fill: "#e05252" }, duration: 0.5, ease: "power1.inOut" }, 4.6);
      tl.fromTo("#v-halo", { opacity: 0, scale: 0.45 }, { opacity: 1, scale: 1.12, duration: 1.1, ease: "power2.out" }, 4.6);
      // finite halo pulse: 3 cycles
      tl.fromTo("#v-halo", { scale: 1.0 }, { scale: 1.16, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.4);
      // risk propagates outward along corridors
      tl.to("#r1", { strokeOpacity: 0.55, duration: 0.4 }, 5.6);
      tl.fromTo("#pp1", { opacity: 0.7, scale: 0.5 }, { opacity: 0, scale: 2.2, duration: 0.9, ease: "power1.out" }, 5.7);
      tl.to("#r2", { strokeOpacity: 0.55, duration: 0.4 }, 6.1);
      tl.fromTo("#pp2", { opacity: 0.7, scale: 0.5 }, { opacity: 0, scale: 2.2, duration: 0.9, ease: "power1.out" }, 6.2);
      tl.to("#r3", { strokeOpacity: 0.55, duration: 0.4 }, 6.6);
      tl.fromTo("#pp3", { opacity: 0.7, scale: 0.5 }, { opacity: 0, scale: 2.2, duration: 0.9, ease: "power1.out" }, 6.7);
      tl.to("#r4", { strokeOpacity: 0.5, duration: 0.4 }, 7.1);

      /* ═══ SCENE 3 — intelligence & resource flow (8.0 – 12.4) ═══ */
      // the thinking moment: a violet sweep ripples outward
      tl.fromTo("#sweep-ring", { opacity: 0.8, scale: 0.25 }, { opacity: 0, scale: 2.7, duration: 1.7, ease: "power1.out" }, 8.3);
      tl.fromTo("#sweep-ring-2", { opacity: 0.5, scale: 0.25 }, { opacity: 0, scale: 2.1, duration: 1.9, ease: "power1.out" }, 8.55);
      // surplus facilities illuminate (peach)
      tl.to("#s1-glow", { opacity: 1, duration: 0.5 }, 8.95);
      tl.to("#s1-node", { attr: { fill: "#ffd6a5" }, duration: 0.4 }, 8.95);
      tl.to("#s2-glow", { opacity: 1, duration: 0.5 }, 9.3);
      tl.to("#s3-glow", { opacity: 1, duration: 0.5 }, 9.65);
      // resource flows travel along the corridors (finite dash cycles)
      tl.to("#flow-paths", { strokeOpacity: 0.92, duration: 0.5 }, 8.95);
      ["#f1", "#f2", "#f3"].forEach((id, i) => {
        tl.fromTo(id, { strokeDashoffset: 26 }, { strokeDashoffset: 0, duration: 0.85, ease: "none", repeat: 3 }, 9.0 + i * 0.35);
      });
      // the vulnerable point begins to recover as help arrives
      tl.to("#v-halo", { scale: 0.6, duration: 2.6, ease: "power1.inOut" }, 9.6);

      /* ═══ SCENE 4 — stabilization (12.2 – 15.6) ═══ */
      tl.to("#v-halo", { opacity: 0, scale: 0.4, duration: 1.0, ease: "power1.out" }, 12.5);
      tl.to("#v-node", { attr: { fill: "#37c0bb" }, duration: 0.6, ease: "power1.inOut" }, 12.9);
      // corridors calm back to structural teal
      ["#r1", "#r2", "#r3", "#r4"].forEach((id, i) => {
        tl.to(id, { strokeOpacity: 0, duration: 0.5 }, 12.9 + i * 0.14);
      });
      tl.to("#flow-paths", { strokeOpacity: 0, duration: 0.6 }, 12.3);
      tl.to("#s1-glow, #s2-glow, #s3-glow", { opacity: 0.45, duration: 0.8 }, 13.1);

      /* ═══ SCENE 5 — extended brand resolution (14.7 – 19.5) ═══
         The brand row lands on the 18.56s strong beat and holds; the
         loop seam is a long exhale into near-black, so the final frame
         matches the opening darkness and the hero loop is seamless. */
      tl.to("#net-inner", { opacity: 0.32, duration: 1.1, ease: "power1.inOut" }, 14.75);
      tl.fromTo("#brand-inner", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 14.9);
      tl.fromTo(".brand-row", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.3)" }, 18.0);
      tl.fromTo("#tagline .t1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 18.45);
      tl.fromTo("#tagline .t2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 18.65);
      tl.fromTo("#tagline .t3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 18.85);
      // loop seam: longer + darker settle for an imperceptible restart
      tl.to("#seam", { opacity: 1, duration: 0.75, ease: "power1.in" }, 18.75);

      /* ═══ Audio-reactive: subtle — pre-extracted RMS/bass breathes three
             decoratives (atmosphere, brand glow). No other tweens touch
             these elements' opacity. ═══ */
      tl.fromTo("#brand-glow-wrap", { opacity: 0 }, { opacity: 0.7, duration: 0.8, ease: "power1.out" }, 15.0);
      const frames = window.AUDIO_DATA.frames;
      for (let f = 0; f < Math.ceil(DUR * FPS); f++) {
        tl.call(
          (function (fr) {
            return function () {
              const rms = fr ? fr.rms : 0;
              const bass = fr ? fr.bands[0] : 0;
              gsap.set("#atmo", { opacity: 0.45 + rms * 0.4 });
              gsap.set("#brand-glow", { opacity: 0.35 + rms * 0.5 });
            };
          })(frames[f]),
          [],
          f / FPS
        );
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
